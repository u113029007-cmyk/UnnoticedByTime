<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DCD6C8">
<meta name="description" content="一台會畫畫的禪風相機：拍下此刻，讓它慢慢化成一幅畫。">
<title>Unnoticed by Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Noto+Serif+TC:wght@300;400;500&display=swap">
<style>
:root{
  --sand:#DCD6C8;
  --paper:#EEE9DE;
  --ink:#26241F;
  --ink-soft:#5B574E;
  --moss:#5F6A49;
  --wood:#A98A63;
  --title:"Shippori Mincho","Noto Serif TC",serif;
  --body:"Noto Serif TC","Shippori Mincho",serif;
  --ease:cubic-bezier(.33,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--sand);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--moss);outline-offset:4px}
[hidden]{display:none!important}

/* 背景：沙庭與光斑 */
#bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.dapple,.shade{position:fixed;pointer-events:none;z-index:1}
.dapple{inset:-25%;mix-blend-mode:soft-light;filter:blur(10px);
  background:
    radial-gradient(ellipse 14% 9% at 22% 28%,rgba(255,244,210,.95),transparent 70%),
    radial-gradient(ellipse 7% 5% at 31% 36%,rgba(255,244,210,.9),transparent 70%),
    radial-gradient(ellipse 11% 7% at 18% 44%,rgba(255,244,210,.8),transparent 70%),
    radial-gradient(ellipse 16% 10% at 64% 22%,rgba(255,244,210,.85),transparent 70%),
    radial-gradient(ellipse 8% 6% at 72% 31%,rgba(255,244,210,.9),transparent 70%),
    radial-gradient(ellipse 12% 8% at 55% 58%,rgba(255,244,210,.75),transparent 70%),
    radial-gradient(ellipse 9% 6% at 40% 70%,rgba(255,244,210,.8),transparent 70%),
    radial-gradient(ellipse 13% 9% at 80% 66%,rgba(255,244,210,.7),transparent 70%);
  animation:drift 46s ease-in-out infinite alternate}
.shade{inset:0;background:radial-gradient(ellipse 90% 80% at 45% 40%,transparent 40%,rgba(38,36,31,.28) 100%)}
@keyframes drift{
  0%{transform:translate3d(-4%,-2%,0) rotate(-1.5deg)}
  50%{transform:translate3d(1%,2%,0) rotate(.5deg)}
  100%{transform:translate3d(5%,-1%,0) rotate(2deg)}}

/* 畫面切換 */
.screen{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;
  padding:max(1.2rem,env(safe-area-inset-top)) 1.2rem max(1.2rem,env(safe-area-inset-bottom));
  opacity:0;visibility:hidden;transition:opacity 1.1s var(--ease),visibility 0s linear 1.1s}
.screen.active{opacity:1;visibility:visible;transition:opacity 1.1s var(--ease) .2s,visibility 0s}

/* 共用元件 */
.hint{font-size:.85rem;letter-spacing:.3em;margin-right:-.3em;color:var(--ink-soft);text-align:center;line-height:1.8;min-height:1.8em}
.text-btn{font-size:.9rem;letter-spacing:.2em;padding:.6em .3em;border-bottom:1px solid rgba(38,36,31,.35);transition:border-color .5s}
.text-btn:hover{border-color:var(--ink)}
.primary-btn{background:var(--ink);color:var(--paper);padding:.85em 2.4em;letter-spacing:.3em;font-size:.95rem;border-radius:2px;transition:background .6s}
.primary-btn:hover{background:#3a372f}
.corner-btn{position:absolute;top:max(1rem,env(safe-area-inset-top));left:1rem;font-size:.85rem;letter-spacing:.2em;padding:.6em .8em;color:var(--ink-soft)}
.corner-btn:hover{color:var(--ink)}

/* 圓相快門 */
.enso{width:clamp(110px,22vmin,170px);aspect-ratio:1;display:grid;place-items:center;border-radius:50%}
.enso.small{width:clamp(76px,16vmin,98px)}
.enso svg{width:100%;height:100%;overflow:visible;transition:transform 1.2s var(--ease)}
.enso path{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.enso .s1{stroke-width:9}
.enso .s2{stroke-width:3.5;opacity:.5}
.screen.active .enso path{animation:draw 2.4s var(--ease) .3s forwards}
#opening.active .enso path{animation-delay:1.8s}
.enso:hover svg{transform:rotate(-8deg)}
.enso:active svg{transform:scale(.93)}
@keyframes draw{to{stroke-dashoffset:0}}

/* 開場 */
.opening-content{display:flex;flex-direction:column;align-items:center;gap:1.5rem}
.title{font-family:var(--title);font-weight:400;font-size:clamp(2.3rem,7.5vw,5.2rem);letter-spacing:.04em;line-height:1.1;text-align:center;opacity:0;filter:blur(10px);transform:translateY(6px)}
.subtitle{font-size:clamp(.85rem,2.2vw,1.02rem);letter-spacing:.5em;margin:-.4rem -.5em 1rem 0;color:var(--ink-soft);opacity:0}
#opening .hint,#openGallery{opacity:0}
#opening.active .title{animation:emerge 4.2s var(--ease) .5s forwards}
#opening.active .subtitle{animation:fadein 2.4s var(--ease) 3.2s forwards}
#opening.active .hint,#opening.active #openGallery{animation:fadein 2s var(--ease) 4s forwards}
@keyframes emerge{to{opacity:1;filter:blur(0);transform:none}}
@keyframes fadein{to{opacity:1}}

/* 取景 */
.viewfinder{position:relative;width:min(88vw,calc(60vh*4/3),860px);aspect-ratio:4/3;background:#1f1d19;border:12px solid var(--wood);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),0 20px 40px -26px rgba(38,36,31,.8);overflow:hidden}
@media (orientation:portrait){.viewfinder{width:min(84vw,calc(58vh*3/4));aspect-ratio:3/4}}
.viewfinder video{width:100%;height:100%;object-fit:cover;display:block}
.viewfinder video.mirror{transform:scaleX(-1)}
.vf-message{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:1.5rem;color:var(--paper);font-size:.95rem;line-height:2;letter-spacing:.12em}
.flash{position:absolute;inset:0;background:#fffaf0;opacity:0;pointer-events:none}
.flash.go{animation:flash .9s var(--ease)}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.capture-controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.4rem;width:min(88vw,520px)}
.capture-controls .left{justify-self:end}
.capture-controls .right{justify-self:start}

/* 作畫台 */
#atelier{justify-content:flex-start;overflow-y:auto}
.atelier{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(1.5rem,4vw,3.5rem);align-items:center;width:min(94vw,1060px);margin:auto 0}
@media (max-width:760px){.atelier{grid-template-columns:1fr;gap:1.2rem;padding-top:2.6rem}}
.preview{border:8px solid var(--wood);background:#1f1d19;justify-self:center;line-height:0;max-width:100%}
.preview canvas{max-width:100%;max-height:56vh;width:auto;height:auto}
@media (max-width:760px){.preview canvas{max-height:30vh}}
fieldset{border:0;margin-bottom:1.3rem}
legend{font-size:.85rem;letter-spacing:.4em;color:var(--ink-soft);margin-bottom:.7rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:.5em;padding:.55em 1.05em;border:1px solid rgba(38,36,31,.3);border-radius:2px;font-size:.95rem;letter-spacing:.12em;cursor:pointer;background:rgba(238,233,222,.4);transition:background .5s,color .5s,border-color .5s}
.chip input:checked+span{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip input:focus-visible+span{outline:2px solid var(--moss);outline-offset:3px}
.swatch{width:18px;height:18px;border-radius:50%;background-size:cover;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.atelier-actions{display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap;margin-top:.4rem}

/* 浮現 */
.easel{line-height:0;box-shadow:0 26px 50px -30px rgba(38,36,31,.7)}
#revealCanvas{display:block;touch-action:none}
#revealCanvas.smear{cursor:crosshair}

/* 畫廊 */
#gallery{padding:0;gap:0;justify-content:stretch;background-color:#5E4632;background-repeat:repeat-x;background-size:auto 100%}
.wall{position:relative;flex:1;width:100%;min-height:0;background:radial-gradient(ellipse 120% 75% at 50% 32%,rgba(255,214,160,.12),rgba(0,0,0,.4) 78%)}
.rail{position:absolute;top:8%;left:0;right:0;height:6px;background:linear-gradient(#3d2c1f,#2a1e15);box-shadow:0 2px 0 rgba(255,255,255,.06)}
.floor{position:absolute;left:0;right:0;bottom:0;height:15%;background:linear-gradient(#2f2219,#45331f 40%,#2a1f16);box-shadow:0 -1px 0 rgba(255,230,190,.12)}
.track{position:absolute;inset:0;display:flex;align-items:stretch;gap:clamp(2.5rem,7vw,6rem);padding:0 clamp(2rem,10vw,9rem);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;cursor:grab}
.track::-webkit-scrollbar{display:none}
.track.dragging{cursor:grabbing}
.work{position:relative;flex:none;height:100%;display:flex;flex-direction:column;align-items:center}
.work::before{content:"";position:absolute;inset:0 -40%;background:radial-gradient(ellipse 45% 36% at 50% 42%,rgba(255,224,170,.16),transparent 70%);pointer-events:none}
.work .top{height:calc(8% + 6px);flex:none}
.cord{flex:1;width:1px;min-height:14px;background:rgba(230,212,180,.45)}
.frame{position:relative;padding:10px;background:linear-gradient(135deg,#d9c29c,#b69669 55%,#a2824f);box-shadow:0 18px 30px -18px rgba(0,0,0,.75)}
.frame canvas{display:block;height:min(44vh,420px);width:auto;max-width:78vw}
.plaque{margin-top:1rem;padding:.5rem .9rem;background:#d8c4a2;color:#3b3226;font-size:.74rem;letter-spacing:.12em;display:flex;flex-direction:column;align-items:center;gap:.3rem;border-radius:1px;box-shadow:0 2px 6px -3px rgba(0,0,0,.6)}
.palette{display:flex;gap:4px}
.palette i{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.work .bottom{flex:1.7}
.work.fresh .frame,.work.fresh .plaque,.work.fresh .cord{animation:hang 2.6s var(--ease) both}
@keyframes hang{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.work.fall .frame,.work.fall .plaque,.work.fall .cord{animation:fall 3.8s cubic-bezier(.45,.05,.55,.95) forwards}
@keyframes fall{
  0%{opacity:1;transform:none}
  20%{transform:translate(-8px,14px) rotate(-5deg)}
  55%{opacity:.7;transform:translate(24px,28vh) rotate(9deg)}
  100%{opacity:0;transform:translate(52px,62vh) rotate(18deg)}}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--paper);letter-spacing:.3em;font-size:1rem;text-align:center;line-height:2;pointer-events:none}
.gallery-bar{position:relative;z-index:3;width:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.9rem clamp(1rem,4vw,2.5rem) max(.9rem,env(safe-area-inset-bottom));background:#221912;color:var(--paper)}
.gallery-bar .text-btn{border-color:rgba(238,233,222,.35)}
.gallery-bar .primary-btn{background:var(--paper);color:var(--ink)}
.count{font-size:.8rem;letter-spacing:.2em;opacity:.7}

/* 聲音開關 */
#soundBtn{position:fixed;z-index:20;top:max(.8rem,env(safe-area-inset-top));right:.8rem;width:44px;height:44px;display:grid;place-items:center;color:var(--ink);opacity:.75;transition:color 1s,opacity .4s}
#soundBtn:hover{opacity:1}
body[data-screen="gallery"] #soundBtn{color:var(--paper)}
#soundBtn svg{width:22px;height:22px}
#soundBtn .off{display:none}
#soundBtn[aria-pressed="false"] .on{display:none}
#soundBtn[aria-pressed="false"] .off{display:inline}

.noscript{position:fixed;inset:0;display:grid;place-items:center;z-index:99;background:var(--sand);letter-spacing:.2em}

@media (prefers-reduced-motion:reduce){
  .dapple{animation:none}
  #opening.active .title{animation-duration:1.2s}
}
</style>
</head>
<body data-screen="opening">
<noscript><p class="noscript">這個作品需要開啟 JavaScript 才能使用。</p></noscript>

<canvas id="bgCanvas" aria-hidden="true"></canvas>
<div class="dapple" aria-hidden="true"></div>
<div class="shade" aria-hidden="true"></div>

<button id="soundBtn" aria-pressed="true" aria-label="環境音開關">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
    <g class="on"><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18 6.8a7.5 7.5 0 0 1 0 10.4"/></g>
    <g class="off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g>
  </svg>
</button>

<!-- 1. 開場 -->
<section id="opening" class="screen active" aria-label="開場">
  <div class="opening-content">
    <h1 class="title">Unnoticed by Time</h1>
    <p class="subtitle">慢到，時間也沒有察覺</p>
    <button class="enso" id="enterBtn" aria-label="打開相機">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <path class="s1" pathLength="1" d="M123.9 34.2 A70 70 0 1 1 87.8 31.1"/>
        <path class="s2" pathLength="1" d="M138 45 A64 66 0 1 1 104 34"/>
      </svg>
    </button>
    <p class="hint">輕觸圓相，打開相機</p>
    <button class="text-btn" id="openGallery" hidden>走進畫廊</button>
  </div>
</section>

<!-- 2. 取景 -->
<section id="capture" class="screen" aria-label="取景">
  <button class="corner-btn" data-go="opening">返回</button>
  <div class="viewfinder" id="viewfinder">
    <video id="video" playsinline muted></video>
    <div class="vf-message" id="vfMessage" hidden></div>
    <div class="flash" id="flash"></div>
  </div>
  <p class="hint">對準想留下的此刻</p>
  <div class="capture-controls">
    <button class="text-btn left" id="pickBtn">從相簿選一張</button>
    <button class="enso small" id="shutterBtn" aria-label="拍照">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <path class="s1" pathLength="1" d="M123.9 34.2 A70 70 0 1 1 87.8 31.1"/>
        <path class="s2" pathLength="1" d="M138 45 A64 66 0 1 1 104 34"/>
      </svg>
    </button>
    <button class="text-btn right" id="flipBtn" hidden>切換鏡頭</button>
  </div>
  <input type="file" id="fileInput" accept="image/*" hidden>
</section>

<!-- 3. 作畫台 -->
<section id="atelier" class="screen" aria-label="作畫台">
  <button class="corner-btn" data-go="capture">重新取景</button>
  <div class="atelier">
    <figure class="preview"><canvas id="previewCanvas" role="img" aria-label="剛拍下的照片"></canvas></figure>
    <form class="choices" id="choices" onsubmit="return false">
      <fieldset>
        <legend>畫風</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="style" value="watercolor" checked><span>水彩</span></label>
          <label class="chip"><input type="radio" name="style" value="collage"><span>碎紙拼接</span></label>
          <label class="chip"><input type="radio" name="style" value="kintsugi"><span>碎瓷金繼</span></label>
          <label class="chip"><input type="radio" name="style" value="wax"><span>融蠟流淌</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>材質</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="material" value="washi" checked><span><i class="swatch" data-mat="washi"></i>和紙</span></label>
          <label class="chip"><input type="radio" name="material" value="stone"><span><i class="swatch" data-mat="stone"></i>石頭</span></label>
          <label class="chip"><input type="radio" name="material" value="wood"><span><i class="swatch" data-mat="wood"></i>木板</span></label>
          <label class="chip"><input type="radio" name="material" value="water"><span><i class="swatch" data-mat="water"></i>水面</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>浮現方式</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="mode" value="auto" checked><span>自動浮現</span></label>
          <label class="chip"><input type="radio" name="mode" value="smear"><span>親手塗抹</span></label>
        </div>
      </fieldset>
      <div class="atelier-actions">
        <button class="primary-btn" id="paintBtn" type="button">開始作畫</button>
      </div>
    </form>
  </div>
</section>

<!-- 4. 浮現 -->
<section id="reveal" class="screen" aria-label="浮現">
  <div class="easel"><canvas id="revealCanvas" role="img" aria-label="正在浮現的畫作"></canvas></div>
  <p class="hint" id="revealHint"></p>
  <button class="primary-btn" id="toGalleryBtn" hidden>走進畫廊</button>
</section>

<!-- 5. 畫廊 -->
<section id="gallery" class="screen" aria-label="畫廊">
  <div class="wall">
    <div class="rail" aria-hidden="true"></div>
    <div class="floor" aria-hidden="true"></div>
    <div class="track" id="track" tabindex="0" aria-label="作品長牆，可左右捲動"></div>
    <p class="empty" id="emptyMsg" hidden>牆上還空著<br>拍下第一幅吧</p>
  </div>
  <div class="gallery-bar">
    <button class="text-btn" data-go="opening">回到入口</button>
    <span class="count" id="galleryCount"></span>
    <button class="primary-btn" id="againBtn">再拍一張</button>
  </div>
</section>

<script>
(() => {
'use strict';

/* ---------- 基本設定 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const STYLES = { watercolor: '水彩', collage: '碎紙拼接', kintsugi: '碎瓷金繼', wax: '融蠟流淌' };
const MATERIALS = { washi: '和紙', stone: '石頭', wood: '木板', water: '水面' };
const MAX_WORKS = 20;
const REVEAL_MS = 10000;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const wait = ms => new Promise(r => setTimeout(r, ms));
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));
const vibrate = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function readCtx(c) { return c.getContext('2d', { willReadFrequently: true }); }

/* ---------- 亂數與雜訊 ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeNoise(seed) {
  const rnd = mulberry32(seed), P = 256, g = new Float32Array(P * P);
  for (let i = 0; i < g.length; i++) g[i] = rnd();
  const ss = t => t * t * (3 - 2 * t);
  function n(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
    const a = g[y0 * P + x0], b = g[y0 * P + x1], c = g[y1 * P + x0], d = g[y1 * P + x1];
    const u = ss(xf), v = ss(yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  n.fbm = (x, y, oct = 4) => {
    let acc = 0, amp = .5, f = 1, norm = 0;
    for (let i = 0; i < oct; i++) { acc += amp * n(x * f + i * 17.3, y * f + i * 9.1); norm += amp; amp *= .5; f *= 2; }
    return acc / norm;
  };
  return n;
}

/* ---------- 影像工具 ---------- */
function blur(src, w, h, r) {
  if (r < 1) return src.slice();
  const tmp = new Float32Array(src.length), out = new Float32Array(src.length), inv = 1 / (2 * r + 1);
  for (let y = 0; y < h; y++) {
    const row = y * w; let acc = 0;
    for (let k = -r; k <= r; k++) acc += src[row + clamp(k, 0, w - 1)];
    for (let x = 0; x < w; x++) {
      tmp[row + x] = acc * inv;
      acc += src[row + Math.min(x + r + 1, w - 1)] - src[row + Math.max(x - r, 0)];
    }
  }
  for (let x = 0; x < w; x++) {
    let acc = 0;
    for (let k = -r; k <= r; k++) acc += tmp[clamp(k, 0, h - 1) * w + x];
    for (let y = 0; y < h; y++) {
      out[y * w + x] = acc * inv;
      acc += tmp[Math.min(y + r + 1, h - 1) * w + x] - tmp[Math.max(y - r, 0) * w + x];
    }
  }
  return out;

const store = {

function startReveal(res, mode) {

  const mw = Math.ceil(W / 6), mh = Math.ceil(H / 6), mask = makeCanvas(mw, mh);
  const nz = makeNoise((Date.now() & 0xfff) + 3), order = new Float32Array(mw * mh);
  let lo = 1e9, hi = -1e9;
  for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) {
    const dc = Math.hypot((x - mw / 2) / mw, (y - mh / 2) / mh) * 1.4;
    const v = .55 * nz.fbm(x * .08, y * .08, 3) + .45 * dc;

    '<figcaption class="plaque"><time></time><span class="meta"></span><span class="palette"></span></figcaption><div class="bottom"></div>';
  const bmp = await loadBitmap(new Blob([w.data], { type: 'image/jpeg' }));
  const cv = $('canvas', el), k = Math.min(1, 640 / Math.max(bmp.width, bmp.height));
  cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  const c = cv.getContext('2d'); c.drawImage(bmp, 0, 0, cv.width, cv.height);
  cv.setAttribute('aria-label', `${STYLES[w.style]}，畫在${MATERIALS[w.material]}上`);
  $('time', el).textContent = fmtDate(w.id);
  $('.meta', el).textContent = `${STYLES[w.style]}／${MATERIALS[w.material]}`;
  $('.palette', el).innerHTML = (w.palette || []).map(h => `<i style="background:${h}" title="${h}"></i>`).join('');
  if (w.material === 'water') {
    const src = makeCanvas(cv.width, cv.height); src.getContext('2d').drawImage(cv, 0, 0);
    waterItems.push({ el, ctx: c, src, amp: cv.width * (REDUCED ? .002 : .004), visible: false });
  }
  return el;
}
async function renderGallery() {
  stopGallery();
  track.innerHTML = '';
  let works = [];
  try { works = await store.all(); } catch (e) {}
  works.sort((a, b) => b.id - a.id);
  $('#emptyMsg').hidden = works.length > 0 || pendingFalls.length > 0;
  $('#galleryCount').textContent = `${works.length}／${MAX_WORKS} 幅`;
  for (const w of works) {
    const el = await makeWorkEl(w);
    if (w.id === lastSavedId) el.classList.add('fresh');
    track.appendChild(el); io.observe(el);
  }
  for (const w of pendingFalls) {
    const el = await makeWorkEl(w);
    el.classList.add('leaving'); el.dataset.id = w.id;
    track.appendChild(el); io.observe(el);
  }
  lastSavedId = null;
  track.scrollLeft = 0;
  galleryRaf = requestAnimationFrame(galleryTick);
}
function galleryTick(now) {
  const t = now / 1000;
  for (const it of waterItems) if (it.visible) drawRipple(it.ctx, it.src, t, it.amp);
  galleryRaf = requestAnimationFrame(galleryTick);
}
function dropWork(el) {
  el.classList.remove('leaving'); el.classList.add('fall');
  const id = Number(el.dataset.id);
  setTimeout(() => {
    io.unobserve(el); el.remove();
    pendingFalls = pendingFalls.filter(w => w.id !== id);
    waterItems = waterItems.filter(w => w.el !== el);
  }, 3900);
}
function stopGallery() {
  cancelAnimationFrame(galleryRaf);
  waterItems = [];
  io.disconnect();
}
track.addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { track.scrollLeft += e.deltaY; e.preventDefault(); }
}, { passive: false });
let drag = null;
track.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse') return;
  drag = { x: e.clientX, s: track.scrollLeft }; track.classList.add('dragging'); track.setPointerCapture(e.pointerId);
});
track.addEventListener('pointermove', e => { if (drag) track.scrollLeft = drag.s - (e.clientX - drag.x); });
['pointerup', 'pointercancel'].forEach(t => track.addEventListener(t, () => { drag = null; track.classList.remove('dragging'); }));
track.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') track.scrollBy({ left: 320, behavior: 'smooth' });
  if (e.key === 'ArrowLeft') track.scrollBy({ left: -320, behavior: 'smooth' });
});
$('#againBtn').addEventListener('click', () => go('capture'));

/* ---------- 開場 ---------- */
async function updateOpeningLink() {
  let n = 0;
  try { n = (await store.all()).length; } catch (e) {}
  const b = $('#openGallery');
  b.hidden = n === 0;
  b.textContent = `走進畫廊（${n}）`;
}
$('#openGallery').addEventListener('click', () => { Sound.init(); go('gallery'); });
$('#enterBtn').addEventListener('click', () => { Sound.init(); go('capture'); });
$('#soundBtn').addEventListener('click', () => { Sound.setOn(!Sound.on); Sound.init(); });
document.addEventListener('pointerdown', () => Sound.init(), { once: true });

/* ---------- 啟動 ---------- */
let resizeTimer = 0, lastSize = innerWidth + 'x' + innerHeight;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const s = innerWidth + 'x' + innerHeight;
    if (s !== lastSize) { lastSize = s; drawSand(); }
    if (reveal) fitCanvas($('#revealCanvas'), reveal.res.W, reveal.res.H);
  }, 250);
});
(async function init() {
  drawSand();
  $('#gallery').style.backgroundImage = `url(${makeWall()})`;
  $$('.swatch').forEach(s => { s.style.backgroundImage = `url(${makeMaterial(s.dataset.mat, 72, 72, 3).toDataURL()})`; });
  await store.open();
  updateOpeningLink();
})();
})();
</script>
