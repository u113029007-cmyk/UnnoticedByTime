<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DCD6C8">
<meta name="description" content="一台會畫畫的禪風相機：拍下此刻，讓它慢慢化成一幅畫。">
<title>Unnoticed by Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Noto+Serif+TC:wght@300;400;500&display=swap">
<style>
:root{
  --sand:#DCD6C8;
  --paper:#EEE9DE;
  --ink:#26241F;
  --ink-soft:#5B574E;
  --moss:#5F6A49;
  --wood:#A98A63;
  --title:"Shippori Mincho","Noto Serif TC",serif;
  --body:"Noto Serif TC","Shippori Mincho",serif;
  --ease:cubic-bezier(.33,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--sand);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--moss);outline-offset:4px}
[hidden]{display:none!important}

/* 背景：沙庭與光斑 */
#bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.dapple,.shade{position:fixed;pointer-events:none;z-index:1}
.dapple{inset:-25%;mix-blend-mode:soft-light;filter:blur(10px);
  background:
    radial-gradient(ellipse 14% 9% at 22% 28%,rgba(255,244,210,.95),transparent 70%),
    radial-gradient(ellipse 7% 5% at 31% 36%,rgba(255,244,210,.9),transparent 70%),
    radial-gradient(ellipse 11% 7% at 18% 44%,rgba(255,244,210,.8),transparent 70%),
    radial-gradient(ellipse 16% 10% at 64% 22%,rgba(255,244,210,.85),transparent 70%),
    radial-gradient(ellipse 8% 6% at 72% 31%,rgba(255,244,210,.9),transparent 70%),
    radial-gradient(ellipse 12% 8% at 55% 58%,rgba(255,244,210,.75),transparent 70%),
    radial-gradient(ellipse 9% 6% at 40% 70%,rgba(255,244,210,.8),transparent 70%),
    radial-gradient(ellipse 13% 9% at 80% 66%,rgba(255,244,210,.7),transparent 70%);
  animation:drift 46s ease-in-out infinite alternate}
.shade{inset:0;background:radial-gradient(ellipse 90% 80% at 45% 40%,transparent 40%,rgba(38,36,31,.28) 100%)}
@keyframes drift{
  0%{transform:translate3d(-4%,-2%,0) rotate(-1.5deg)}
  50%{transform:translate3d(1%,2%,0) rotate(.5deg)}
  100%{transform:translate3d(5%,-1%,0) rotate(2deg)}}

/* 畫面切換 */
.screen{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;
  padding:max(1.2rem,env(safe-area-inset-top)) 1.2rem max(1.2rem,env(safe-area-inset-bottom));
  opacity:0;visibility:hidden;transition:opacity 1.1s var(--ease),visibility 0s linear 1.1s}
.screen.active{opacity:1;visibility:visible;transition:opacity 1.1s var(--ease) .2s,visibility 0s}

/* 共用元件 */
.hint{font-size:.85rem;letter-spacing:.3em;margin-right:-.3em;color:var(--ink-soft);text-align:center;line-height:1.8;min-height:1.8em}
.text-btn{white-space:nowrap;font-size:.9rem;letter-spacing:.2em;padding:.6em .3em;border-bottom:1px solid rgba(38,36,31,.35);transition:border-color .5s}
.text-btn:hover{border-color:var(--ink)}
.primary-btn{background:var(--ink);color:var(--paper);padding:.85em 2.4em;letter-spacing:.3em;font-size:.95rem;border-radius:2px;transition:background .6s}
.primary-btn:hover{background:#3a372f}
.corner-btn{position:absolute;top:max(1rem,env(safe-area-inset-top));left:1rem;font-size:.85rem;letter-spacing:.2em;padding:.6em .8em;color:var(--ink-soft)}
.corner-btn:hover{color:var(--ink)}

/* 圓相快門 */
.enso{width:clamp(110px,22vmin,170px);aspect-ratio:1;display:grid;place-items:center;border-radius:50%}
.enso.small{width:clamp(76px,16vmin,98px)}
.enso svg{width:100%;height:100%;overflow:visible;transition:transform 1.2s var(--ease)}
.enso path{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.enso .s1{stroke-width:9}
.enso .s2{stroke-width:3.5;opacity:.5}
.screen.active .enso path{animation:draw 2.4s var(--ease) .3s forwards}
#opening.active .enso path{animation-delay:1.8s}
.enso:hover svg{transform:rotate(-8deg)}
.enso:active svg{transform:scale(.93)}
@keyframes draw{to{stroke-dashoffset:0}}

/* 開場 */
.opening-content{display:flex;flex-direction:column;align-items:center;gap:1.5rem}
.title{font-family:var(--title);font-weight:400;font-size:clamp(2.3rem,7.5vw,5.2rem);letter-spacing:.04em;line-height:1.1;text-align:center;opacity:0;filter:blur(10px);transform:translateY(6px)}
.subtitle{font-size:clamp(.85rem,2.2vw,1.02rem);letter-spacing:.5em;margin:-.4rem -.5em 1rem 0;color:var(--ink-soft);opacity:0}
#opening .hint,#openGallery{opacity:0}
#opening.active .title{animation:emerge 4.2s var(--ease) .5s forwards}
#opening.active .subtitle{animation:fadein 2.4s var(--ease) 3.2s forwards}
#opening.active .hint,#opening.active #openGallery{animation:fadein 2s var(--ease) 4s forwards}
@keyframes emerge{to{opacity:1;filter:blur(0);transform:none}}
@keyframes fadein{to{opacity:1}}

/* 取景 */
#capture{gap:.9rem}
.viewfinder{position:relative;touch-action:none;width:min(88vw,calc(50vh*4/3),860px);aspect-ratio:4/3;background:#1f1d19;border:12px solid var(--wood);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),0 20px 40px -26px rgba(38,36,31,.8);overflow:hidden}
@media (orientation:portrait){.viewfinder{width:min(84vw,calc(46vh*3/4));aspect-ratio:3/4}}
.viewfinder video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;pointer-events:none}
.viewfinder.nogl video{opacity:1}
.viewfinder.nogl #live{display:none}
#live{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .25s}
#live.switching{opacity:.2}
.style-flash{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--title);font-size:clamp(1.6rem,5vw,2.4rem);letter-spacing:.4em;color:#fffaf0;text-shadow:0 1px 14px rgba(0,0,0,.5);opacity:0;pointer-events:none}
.style-flash.show{animation:sflash 1.5s var(--ease)}
@keyframes sflash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.modes{display:flex;gap:1.8rem}
.modes button{font-size:.95rem;letter-spacing:.25em;padding:.3em .1em;color:var(--ink-soft);border-bottom:1px solid transparent;transition:color .5s,border-color .5s}
.modes button[aria-checked="true"]{color:var(--ink);border-color:var(--ink)}
.sliders{display:flex;gap:.5rem 1.8rem;flex-wrap:wrap;justify-content:center;width:min(88vw,620px)}
.slider{display:flex;align-items:center;gap:.6rem;font-size:.8rem;letter-spacing:.15em;color:var(--ink-soft);flex:1;min-width:230px}
.slider input{flex:1;accent-color:var(--ink)}
.slider output{min-width:3em;text-align:right}
.viewfinder video.mirror{transform:scaleX(-1)}
.vf-message{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:1.5rem;color:var(--paper);font-size:.95rem;line-height:2;letter-spacing:.12em}
.flash{position:absolute;inset:0;background:#fffaf0;opacity:0;pointer-events:none}
.flash.go{animation:flash .9s var(--ease)}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.capture-controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.4rem;width:min(88vw,520px)}
.capture-controls .left{justify-self:end}
.capture-controls .right{justify-self:start}

/* 作畫台 */
#atelier{justify-content:flex-start;overflow-y:auto}
.atelier{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(1.5rem,4vw,3.5rem);align-items:center;width:min(94vw,1060px);margin:auto 0}
@media (max-width:760px){.atelier{grid-template-columns:1fr;gap:1.2rem;padding-top:2.6rem}}
.preview{border:8px solid var(--wood);background:#1f1d19;justify-self:center;line-height:0;max-width:100%}
.preview canvas{max-width:100%;max-height:56vh;width:auto;height:auto}
@media (max-width:760px){.preview canvas{max-height:30vh}}
@media (max-width:420px){.capture-controls .text-btn{font-size:.8rem;letter-spacing:.12em}}
fieldset{border:0;margin-bottom:1.3rem}
legend{font-size:.85rem;letter-spacing:.4em;color:var(--ink-soft);margin-bottom:.7rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:.5em;padding:.55em 1.05em;border:1px solid rgba(38,36,31,.3);border-radius:2px;font-size:.95rem;letter-spacing:.12em;cursor:pointer;background:rgba(238,233,222,.4);transition:background .5s,color .5s,border-color .5s}
.chip input:checked+span{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip input:focus-visible+span{outline:2px solid var(--moss);outline-offset:3px}
.swatch{width:18px;height:18px;border-radius:50%;background-size:cover;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.atelier-actions{display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap;margin-top:.4rem}

/* 浮現 */
.easel{line-height:0;box-shadow:0 26px 50px -30px rgba(38,36,31,.7)}
#revealCanvas{display:block;touch-action:none}
#revealCanvas.smear{cursor:crosshair}

/* 畫廊 */
#gallery{padding:0;gap:0;justify-content:stretch;background-color:#5E4632;background-repeat:repeat-x;background-size:auto 100%}
.wall{position:relative;flex:1;width:100%;min-height:0;background:radial-gradient(ellipse 120% 75% at 50% 32%,rgba(255,214,160,.12),rgba(0,0,0,.4) 78%)}
.rail{position:absolute;top:8%;left:0;right:0;height:6px;background:linear-gradient(#3d2c1f,#2a1e15);box-shadow:0 2px 0 rgba(255,255,255,.06)}
.floor{position:absolute;left:0;right:0;bottom:0;height:15%;background:linear-gradient(#2f2219,#45331f 40%,#2a1f16);box-shadow:0 -1px 0 rgba(255,230,190,.12)}
.track{position:absolute;inset:0;display:flex;align-items:stretch;gap:clamp(2.5rem,7vw,6rem);padding:0 clamp(2rem,10vw,9rem);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;cursor:grab}
.track::-webkit-scrollbar{display:none}
.track.dragging{cursor:grabbing}
.work{position:relative;flex:none;height:100%;display:flex;flex-direction:column;align-items:center}
.work::before{content:"";position:absolute;inset:0 -40%;background:radial-gradient(ellipse 45% 36% at 50% 42%,rgba(255,224,170,.16),transparent 70%);pointer-events:none}
.work .top{height:calc(8% + 6px);flex:none}
.cord{flex:1;width:1px;min-height:14px;background:rgba(230,212,180,.45)}
.frame{position:relative;padding:10px;background:linear-gradient(135deg,#d9c29c,#b69669 55%,#a2824f);box-shadow:0 18px 30px -18px rgba(0,0,0,.75)}
.frame canvas{display:block;height:min(44vh,420px);width:auto;max-width:78vw}
.plaque{margin-top:1rem;padding:.5rem .9rem;background:#d8c4a2;color:#3b3226;font-size:.74rem;letter-spacing:.12em;display:flex;flex-direction:column;align-items:center;gap:.3rem;border-radius:1px;box-shadow:0 2px 6px -3px rgba(0,0,0,.6)}
.palette{display:flex;gap:4px}
.palette i{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.work .bottom{flex:1.7}
.work.fresh .frame,.work.fresh .plaque,.work.fresh .cord{animation:hang 2.6s var(--ease) both}
@keyframes hang{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.work.fall .frame,.work.fall .plaque,.work.fall .cord{animation:fall 3.8s cubic-bezier(.45,.05,.55,.95) forwards}
@keyframes fall{
  0%{opacity:1;transform:none}
  20%{transform:translate(-8px,14px) rotate(-5deg)}
  55%{opacity:.7;transform:translate(24px,28vh) rotate(9deg)}
  100%{opacity:0;transform:translate(52px,62vh) rotate(18deg)}}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--paper);letter-spacing:.3em;font-size:1rem;text-align:center;line-height:2;pointer-events:none}
.gallery-bar{position:relative;z-index:3;width:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.9rem clamp(1rem,4vw,2.5rem) max(.9rem,env(safe-area-inset-bottom));background:#221912;color:var(--paper)}
.gallery-bar .text-btn{border-color:rgba(238,233,222,.35)}
.gallery-bar .primary-btn{background:var(--paper);color:var(--ink)}
.count{font-size:.8rem;letter-spacing:.2em;opacity:.7}

/* 完成後：落款、下載 */
.done{display:flex;flex-direction:column;align-items:center;gap:.9rem}
.seal-row{display:flex;align-items:center;gap:.8rem}
.seal-row input{width:12.5em;padding:.55em .8em;border:1px solid rgba(38,36,31,.35);border-radius:2px;background:rgba(238,233,222,.6);letter-spacing:.15em;font-size:.9rem}
.seal-row input:focus{outline:2px solid var(--moss);outline-offset:2px}
.done-row{display:flex;align-items:center;gap:1.4rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.plaque .dl{font-size:.7rem;letter-spacing:.15em;color:#5a4a36;border-bottom:1px solid rgba(90,74,54,.4);padding:.1em 0;margin-top:.15rem}
.bar-group{display:flex;gap:1.2rem}
@media (max-width:520px){.count{display:none}.gallery-bar .text-btn{font-size:.8rem;letter-spacing:.1em}}

/* 拼貼台 */
#collage{justify-content:flex-start;gap:.7rem}
.collage-top{width:min(96vw,1100px);display:flex;justify-content:space-between;align-items:center;padding-right:3rem}
.table-wrap{position:relative;flex:1;min-height:0;width:min(96vw,1100px);box-shadow:0 20px 40px -28px rgba(38,36,31,.8)}
#tableCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#tableCanvas.move{cursor:grab}
.tray{display:flex;gap:.7rem;overflow-x:auto;width:min(96vw,1100px);padding:.2rem .1rem .4rem;scrollbar-width:thin}
.tray button{flex:none;height:64px;padding:3px;background:var(--wood);border-radius:1px;transition:transform .4s var(--ease)}
.tray button:hover{transform:translateY(-3px)}
.tray img{height:100%;width:auto;display:block}
.collage-bar{width:min(96vw,1100px);display:flex;justify-content:space-between;align-items:center}

/* 手機儲存備案 */
.save-sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:1.5rem;background:rgba(30,28,24,.92);color:var(--paper);text-align:center;letter-spacing:.15em;font-size:.9rem;line-height:1.8}
.save-sheet img{max-width:92vw;max-height:68vh;box-shadow:0 20px 40px -20px rgba(0,0,0,.8);-webkit-touch-callout:default;user-select:auto}
.save-sheet .text-btn{border-color:rgba(238,233,222,.4)}
.toast{position:fixed;left:50%;bottom:max(1.5rem,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:rgba(38,36,31,.9);color:var(--paper);padding:.7em 1.3em;border-radius:2px;font-size:.85rem;letter-spacing:.12em;opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* 聲音開關 */
#soundBtn{position:fixed;z-index:20;top:max(.8rem,env(safe-area-inset-top));right:.8rem;width:44px;height:44px;display:grid;place-items:center;color:var(--ink);opacity:.75;transition:color 1s,opacity .4s}
#soundBtn:hover{opacity:1}
body[data-screen="gallery"] #soundBtn{color:var(--paper)}
#soundBtn svg{width:22px;height:22px}
#soundBtn .off{display:none}
#soundBtn[aria-pressed="false"] .on{display:none}
#soundBtn[aria-pressed="false"] .off{display:inline}

.noscript{position:fixed;inset:0;display:grid;place-items:center;z-index:99;background:var(--sand);letter-spacing:.2em}

@media (prefers-reduced-motion:reduce){
  .dapple{animation:none}
  #opening.active .title{animation-duration:1.2s}
}
</style>
</head>
<body data-screen="opening">
<noscript><p class="noscript">這個作品需要開啟 JavaScript 才能使用。</p></noscript>

<canvas id="bgCanvas" aria-hidden="true"></canvas>
<div class="dapple" aria-hidden="true"></div>
<div class="shade" aria-hidden="true"></div>

<button id="soundBtn" aria-pressed="true" aria-label="環境音開關">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
    <g class="on"><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18 6.8a7.5 7.5 0 0 1 0 10.4"/></g>
    <g class="off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g>
  </svg>
</button>

<!-- 1. 開場 -->
<section id="opening" class="screen active" aria-label="開場">
  <div class="opening-content">
    <h1 class="title">Unnoticed by Time</h1>
    <p class="subtitle">慢到，時間也沒有察覺</p>
    <button class="enso" id="enterBtn" aria-label="打開相機">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <path class="s1" pathLength="1" d="M123.9 34.2 A70 70 0 1 1 87.8 31.1"/>
        <path class="s2" pathLength="1" d="M138 45 A64 66 0 1 1 104 34"/>
      </svg>
    </button>
    <p class="hint">輕觸圓相，打開相機</p>
    <button class="text-btn" id="openGallery" hidden>走進畫廊</button>
  </div>
</section>

<!-- 2. 取景 -->
<section id="capture" class="screen" aria-label="取景">
  <button class="corner-btn" data-go="opening">返回</button>
  <div class="viewfinder" id="viewfinder">
    <video id="video" playsinline muted></video>
    <canvas id="live" role="img" aria-label="即時畫風預覽"></canvas>
    <div class="style-flash" id="styleFlash" aria-live="polite"></div>
    <div class="vf-message" id="vfMessage" hidden></div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="modes" role="radiogroup" aria-label="畫風">
    <button role="radio" data-style="watercolor" aria-checked="true">水彩</button>
    <button role="radio" data-style="crayon" aria-checked="false">蠟筆</button>
    <button role="radio" data-style="ukiyoe" aria-checked="false">浮世繪</button>
  </div>
  <div class="sliders">
    <label class="slider"><span>縮放</span><input type="range" id="zoomRange" min="1" max="4" step="0.1" value="1" aria-label="縮放"><output id="zoomOut">1.0×</output></label>
    <label class="slider"><span>寫實</span><input type="range" id="absRange" min="0" max="100" step="1" value="25" aria-label="抽象程度"><span>抽象</span></label>
  </div>
  <div class="capture-controls">
    <button class="text-btn left" id="pickBtn">從相簿選一張</button>
    <button class="enso small" id="shutterBtn" aria-label="拍照">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <path class="s1" pathLength="1" d="M123.9 34.2 A70 70 0 1 1 87.8 31.1"/>
        <path class="s2" pathLength="1" d="M138 45 A64 66 0 1 1 104 34"/>
      </svg>
    </button>
    <button class="text-btn right" id="flipBtn" hidden>切換鏡頭</button>
  </div>
  <input type="file" id="fileInput" accept="image/*" hidden>
</section>

<!-- 3. 作畫台 -->
<section id="atelier" class="screen" aria-label="作畫台">
  <button class="corner-btn" data-go="capture">重新取景</button>
  <div class="atelier">
    <figure class="preview"><canvas id="previewCanvas" role="img" aria-label="剛拍下的照片"></canvas></figure>
    <form class="choices" id="choices" onsubmit="return false">
      <fieldset>
        <legend>畫風</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="style" value="watercolor" checked><span>水彩</span></label>
          <label class="chip"><input type="radio" name="style" value="crayon"><span>蠟筆</span></label>
          <label class="chip"><input type="radio" name="style" value="ukiyoe"><span>浮世繪</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>材質</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="material" value="washi" checked><span><i class="swatch" data-mat="washi"></i>和紙</span></label>
          <label class="chip"><input type="radio" name="material" value="stone"><span><i class="swatch" data-mat="stone"></i>石頭</span></label>
          <label class="chip"><input type="radio" name="material" value="wood"><span><i class="swatch" data-mat="wood"></i>木板</span></label>
          <label class="chip"><input type="radio" name="material" value="water"><span><i class="swatch" data-mat="water"></i>水面</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>浮現方式</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="mode" value="auto" checked><span>自動浮現</span></label>
          <label class="chip"><input type="radio" name="mode" value="smear"><span>親手塗抹</span></label>
        </div>

/* ---------- 合成：畫風 × 材質 ---------- */
function compose(style, material, photo, seed, abs) {
  const longArt = innerWidth < 700 ? 1100 : 1400;
  const k = longArt / Math.max(photo.width, photo.height);
  const aw = Math.round(photo.width * k), ah = Math.round(photo.height * k);
  const m = Math.round(Math.max(aw, ah) * .07), W = aw + 2 * m, H = ah + 2 * m;
  const art = readCtx(renderStyle(photo, aw, ah, style, abs, false)).getImageData(0, 0, aw, ah).data;
  const mat = makeMaterial(material, W, H, seed);
  const final = makeCanvas(W, H), fctx = readCtx(final);
  fctx.drawImage(mat, 0, 0);
  const fi = fctx.getImageData(0, 0, W, H), fd = fi.data;
  let sum = 0, cnt = 0;
  for (let i = 0; i < fd.length; i += 16) { sum += fd[i] * .299 + fd[i + 1] * .587 + fd[i + 2] * .114; cnt++; }
  const avg = sum / cnt, transparent = style !== 'ukiyoe', water = material === 'water';
  const nz = makeNoise(seed + 13), edgeW = Math.max(aw, ah) * .035;
  for (let y = 0; y < ah; y++) for (let x = 0; x < aw; x++) {
    const o = (y * aw + x) * 4;
    let a = 1;
    if (transparent) {
      const dEdge = Math.min(x, y, aw - 1 - x, ah - 1 - y);
      a = smooth(0, edgeW, dEdge + (nz.fbm(x * .02, y * .02, 3) - .5) * edgeW * 1.8);
      if (a <= 0) continue;
    }
    const f = ((y + m) * W + x + m) * 4;
    const Mr = fd[f], Mg = fd[f + 1], Mb = fd[f + 2];
    let r, g, b;
    if (transparent) {
      if (water) { r = mix(Mr, art[o], .82); g = mix(Mg, art[o + 1], .82); b = mix(Mb, art[o + 2], .82); }
      else { r = Mr * art[o] / 255 * 1.04; g = Mg * art[o + 1] / 255 * 1.04; b = Mb * art[o + 2] / 255 * 1.04; }
    } else {
      const tk = water ? .08 : .2, tf = 1 - tk + tk * (Mr * .299 + Mg * .587 + Mb * .114) / avg;
      r = art[o] * tf; g = art[o + 1] * tf; b = art[o + 2] * tf;
    }
    fd[f] = mix(Mr, r, a); fd[f + 1] = mix(Mg, g, a); fd[f + 2] = mix(Mb, b, a);
  }
  fctx.putImageData(fi, 0, 0);
  return { final, mat, W, H, m, water };
}

/* 水面波紋 */
function drawRipple(ctx, src, t, amp) {
  const W = src.width, H = src.height, band = 3;
  ctx.drawImage(src, 0, 0);
  for (let y = 0; y < H; y += band) {
    const off = Math.sin(y * .045 + t * 1.1) * amp + Math.sin(y * .11 - t * .75) * amp * .45;
    ctx.drawImage(src, 0, y, W, band, off, y, W, band);
  }
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 5; i++) {
    const yy = ((i * .21 + t * .012) % 1) * H;
    const g = ctx.createLinearGradient(0, yy - 14, 0, yy + 14);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(220,235,235,.06)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, yy - 14, W, 28);
  }
  ctx.restore();
}

/* 調色盤：顏色分群取 5 色 */
function extractPalette(src) {
  const S = 40, c = makeCanvas(S, S), x = readCtx(c);
  x.drawImage(src, 0, 0, S, S);
  const d = x.getImageData(0, 0, S, S).data, pts = [];
  for (let i = 0; i < d.length; i += 4) pts.push([d[i], d[i + 1], d[i + 2]]);
  const lum = p => p[0] * .299 + p[1] * .587 + p[2] * .114;
  const sorted = pts.slice().sort((a, b) => lum(a) - lum(b)), K = 5;
  let cs = [];
  for (let i = 0; i < K; i++) cs.push(sorted[Math.floor((i + .5) / K * sorted.length)].slice());
  for (let it = 0; it < 10; it++) {
    const acc = cs.map(() => [0, 0, 0, 0]);
    for (const p of pts) {
      let bi = 0, bd = 1e9;
      cs.forEach((c2, ci) => { const dd = (p[0] - c2[0]) ** 2 + (p[1] - c2[1]) ** 2 + (p[2] - c2[2]) ** 2; if (dd < bd) { bd = dd; bi = ci; } });
      const a = acc[bi]; a[0] += p[0]; a[1] += p[1]; a[2] += p[2]; a[3]++;
    }
    cs = cs.map((c2, ci) => acc[ci][3] ? [acc[ci][0] / acc[ci][3], acc[ci][1] / acc[ci][3], acc[ci][2] / acc[ci][3]] : c2);
  }
  return cs.sort((a, b) => lum(a) - lum(b)).map(c2 => '#' + c2.map(v => Math.round(v).toString(16).padStart(2, '0')).join(''));
}

/* ---------- 背景：沙庭（之後換成真實照片） ---------- */
function drawSand() {
  const c = $('#bgCanvas'), w = innerWidth, h = innerHeight;
  const k = Math.min(1.5, Math.sqrt(1.1e6 / (w * h)));
  const W = Math.max(2, Math.round(w * k)), H = Math.max(2, Math.round(h * k));
  c.width = W; c.height = H;
  const x2 = readCtx(c), img = x2.createImageData(W, H), d = img.data;
  const nz = makeNoise(42), rnd = mulberry32(9), u = Math.min(W, H);
  const sx = W * (W > H ? .74 : .8), sy = H * (W > H ? .7 : .95), sr = u * .075, sp = Math.max(6, u * .016), ringZ = sr * 3.4;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const o = (y * W + x) * 4, dx = (x - sx) / 1.45, dy = y - sy, dist = Math.hypot(dx, dy);
    const ang = Math.atan2(dy, dx);
    const rr = sr * (1 + .24 * (nz.fbm(Math.cos(ang) * 1.5 + 5, Math.sin(ang) * 1.5 + 5, 2) - .5));
    const warp = (nz.fbm(x * .003, y * .003, 2) - .5) * sp * 2.2;
    const v = mix(Math.sin(dist / sp * Math.PI * 2), Math.sin((y + warp) / sp * Math.PI * 2), smooth(ringZ * .9, ringZ * 1.1, dist));
    let L = 1 + v * .05 + (rnd() - .5) * .09 + (nz(x * .7, y * .7) - .5) * .05;
    let r = 216 * L, g = 209 * L, b = 194 * L;
    if (dist < rr) {
      const lt = clamp(.5 - (dx + dy) / (rr * 2.4), 0, 1), tex = nz.fbm(x * .04, y * .04, 3);
      const kk = (.7 + .6 * lt) * (.85 + .3 * tex);
      r = 96 * kk; g = 94 * kk; b = 88 * kk;
    } else if (dist < rr * 1.13) {

      r = mix(r, 98 * mk, mm); g = mix(g, 106 * mk, mm); b = mix(b, 72 * mk, mm);

      r *= .87; g *= .87; b *= .87;
    }
    d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = 255;
  }
  x2.putImageData(img, 0, 0);
}

/* 畫廊木牆紋理 */
function makeWall() {
  const W = 512, H = 512, c = makeCanvas(W, H), x2 = readCtx(c), img = x2.createImageData(W, H), d = img.data;
  const nz = makeNoise(77), plank = 128, tones = [1, .93, 1.05, .97];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const o = (y * W + x) * 4, px = x % plank;

    const k = (.82 + nz.fbm(x * .25, y * .008, 3) * .3 + (nz(x * .9, y * .02) - .5) * .12) * seam * tones[Math.floor(x / plank)];
    d[o] = 116 * k; d[o + 1] = 86 * k; d[o + 2] = 60 * k; d[o + 3] = 255;

}

/* ---------- 聲音（全部即時合成） ---------- */
const Sound = {
  ctx: null, master: null, wet: null, on: true,

    const comp = ctx.createDynamicsCompressor();

    const conv = ctx.createConvolver(); conv.buffer = this.impulse(3.2);
    this.wet = ctx.createGain(); this.wet.gain.value = .5;
    this.wet.connect(conv); conv.connect(this.master);

  },
  noise(sec) {
    const ctx = this.ctx, len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return b;
  },
  impulse(sec) {
    const ctx = this.ctx, len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    return b;
  },
  route(node, dry, wet) {
    const g1 = this.ctx.createGain(); g1.gain.value = dry; node.connect(g1); g1.connect(this.master);
    const g2 = this.ctx.createGain(); g2.gain.value = wet; node.connect(g2); g2.connect(this.wet);
  },
  chime(t, f, v) {
    const ctx = this.ctx, out = ctx.createGain();
    let tail = out;
    if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = rand(-.6, .6); out.connect(p); tail = p; }
    for (const [ratio, amp, dec] of [[1, 1, 4.5], [2.756, .45, 2.6], [5.404, .22, 1.6], [8.933, .1, 1]]) {

      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v * amp, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dec);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + dec + .05);
    }

  },
  panLoop() {
    const scale = [146.83, 220, 233.08, 261.63, 293.66, 329.63, 349.23, 440, 523.25];
    const pick = () => scale[Math.floor(Math.random() * scale.length)];
    const loop = () => {
      const now = this.ctx.currentTime + .05;
      this.pan(now, pick(), rand(.05, .09));
      if (Math.random() < .35) this.pan(now + rand(.4, .9), pick(), rand(.03, .06));
      setTimeout(loop, rand(4500, 10000));

  },

/* ---------- 儲存：IndexedDB（失敗時退回記憶體） ---------- */
const store = {
  db: null, mem: [],
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('unnoticed-by-time', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('works', { keyPath: 'id' });
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => res();
      } catch (e) { res(); }
    });
  },
  req(mode, fn) {
    return new Promise((res, rej) => {
      const q = fn(this.db.transaction('works', mode).objectStore('works'));
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
  },
  all() { return this.db ? this.req('readonly', s => s.getAll()) : Promise.resolve(this.mem.slice()); },
  put(w) { if (!this.db) { this.mem.push(w); return Promise.resolve(); } return this.req('readwrite', s => s.put(w)); },
  del(id) { if (!this.db) { this.mem = this.mem.filter(w => w.id !== id); return Promise.resolve(); } return this.req('readwrite', s => s.delete(id)); }
};

/* ---------- 畫面切換 ---------- */
let current = 'opening';
function go(id) {
  if (id === current) return;
  const prev = current;
  $('#' + prev).classList.remove('active');
  $('#' + id).classList.add('active');
  document.body.dataset.screen = id;
  current = id;
  if (prev === 'capture') stopCamera();
  if (prev === 'reveal') stopReveal();
  if (prev === 'gallery') stopGallery();
  if (prev === 'collage') stopCollage();
  if (id === 'collage') startCollage();
  if (id === 'capture') startCamera();
  if (id === 'gallery') renderGallery();
  if (id === 'opening') updateOpeningLink();
}
$$('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));

/* ---------- 取景 ---------- */
const video = $('#video'), live = $('#live'), vf = $('#viewfinder');
const liveR = createRenderer(live, false);
if (!liveR) vf.classList.add('nogl');
let stream = null, facing = 'environment', photo = null, liveRaf = 0;
const cam = { style: 'watercolor', abs: .25, zoom: 1 };

function camMessage(text) { const m = $('#vfMessage'); m.innerHTML = text; m.hidden = !text; }
function coverScale() {
  const vw = video.videoWidth || 4, vh = video.videoHeight || 3, va = vw / vh, ca = vf.clientWidth / vf.clientHeight;
  return va > ca ? [ca / va, 1] : [1, va / ca];
}
function liveLoop() {
  liveRaf = requestAnimationFrame(liveLoop);
  if (!liveR || !stream || video.readyState < 2) return;
  const dpr = Math.min(devicePixelRatio || 1, 2), cap = innerWidth < 700 ? 900 : 1100;
  let w = vf.clientWidth * dpr, h = vf.clientHeight * dpr;
  const k = Math.min(1, cap / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
  if (live.width !== w || live.height !== h) { live.width = w; live.height = h; }
  const [sx, sy] = coverScale();
  liveR.upload(video);
  liveR.draw({ style: cam.style, abs: cam.abs, scale: [sx / cam.zoom, sy / cam.zoom], flip: facing === 'user', preview: true });
}
async function startCamera() {
  camMessage('');
  cancelAnimationFrame(liveRaf); liveRaf = requestAnimationFrame(liveLoop);
  showStyleName();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    camMessage('這個瀏覽器無法開啟相機<br>可以改從相簿選一張照片'); return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    if (current !== 'capture') { stopCamera(); return; }
    video.srcObject = stream;
    await video.play();
    video.classList.toggle('mirror', facing === 'user');
    setZoom(cam.zoom);
    const devs = await navigator.mediaDevices.enumerateDevices();
    $('#flipBtn').hidden = devs.filter(d => d.kind === 'videoinput').length < 2;
  } catch (e) {
    camMessage('相機無法開啟<br>可以改從相簿選一張照片，一樣能繼續');
  }
}
function stopCamera() {
  cancelAnimationFrame(liveRaf);
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; video.srcObject = null;
}
function captureFrame() {
  const vw = video.videoWidth, vh = video.videoHeight, [fx, fy] = coverScale();
  const sw = vw * fx / cam.zoom, sh = vh * fy / cam.zoom;
  const k = Math.min(1, 1400 / Math.max(sw, sh));
  const c = makeCanvas(Math.round(sw * k), Math.round(sh * k)), x2 = c.getContext('2d');
  if (facing === 'user') { x2.translate(c.width, 0); x2.scale(-1, 1); }
  x2.drawImage(video, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, c.width, c.height);
  return c;
}

const pts = new Map();
let pinch = null, swipe = null;
vf.addEventListener('pointerdown', e => {
  vf.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y), z0: cam.zoom }; swipe = null; }
  else if (pts.size === 1) swipe = { x: e.clientX, y: e.clientY, t: performance.now() };
});
vf.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pts.size >= 2) { const [a, b] = [...pts.values()]; setZoom(pinch.z0 * Math.hypot(a.x - b.x, a.y - b.y) / Math.max(1, pinch.d0)); }
});
vf.addEventListener('pointerup', e => {
  if (swipe && !pinch && pts.size === 1) {
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5 && performance.now() - swipe.t < 800) shiftStyle(dx < 0 ? 1 : -1);
  }
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (pts.size === 0) swipe = null;
});
vf.addEventListener('pointercancel', e => { pts.delete(e.pointerId); pinch = null; swipe = null; });
vf.addEventListener('wheel', e => { e.preventDefault(); setZoom(cam.zoom * (1 - e.deltaY * .0015)); }, { passive: false });
document.addEventListener('keydown', e => {
  if (current !== 'capture' || (e.target && e.target.type === 'range')) return;
  if (e.key === 'ArrowRight') shiftStyle(1);
  if (e.key === 'ArrowLeft') shiftStyle(-1);
});

$('#shutterBtn').addEventListener('click', () => {

  try {

    if (window.createImageBitmap) src = await createImageBitmap(file);
    else src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
    const k = Math.min(1, 1400 / Math.max(src.width, src.height));

/* 作畫台預覽：顯示套用畫風後的樣子 */
function setPhoto(c) { photo = c; renderPreview(); }
function renderPreview() {
  if (!photo) return;
  const k = Math.min(1, 1000 / Math.max(photo.width, photo.height));
  const w = Math.round(photo.width * k), h = Math.round(photo.height * k);
  const styled = renderStyle(photo, w, h, cam.style, cam.abs, true);
  const p = $('#previewCanvas'); p.width = w; p.height = h;
  p.getContext('2d').drawImage(styled, 0, 0);
  p.setAttribute('aria-label', `套用${STYLES[cam.style]}後的照片`);
}
$$('#choices input[name="style"]').forEach(r => r.addEventListener('change', () => { setStyle(r.value, false); renderPreview(); }));

/* ---------- 浮現 ---------- */
let reveal = null, current_meta = null;
function fitCanvas(cv, W, H) {
  const k = Math.min(Math.min(innerWidth * .92, 980) / W, innerHeight * (innerWidth < 700 ? .55 : .62) / H);
  cv.style.width = Math.round(W * k) + 'px'; cv.style.height = Math.round(H * k) + 'px';
}
const easeInOut = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;

$('#paintBtn').addEventListener('click', async () => {
  if (!photo) return;
  const fd = new FormData($('#choices'));
  const style = fd.get('style'), material = fd.get('material'), mode = fd.get('mode');
  go('reveal');
  $('#revealHint').textContent = '研墨中';
  const cv = $('#revealCanvas');
  cv.style.visibility = 'hidden';
  await wait(650); await nextFrame();
  $('#doneActions').hidden = true;
  const seed = (Date.now() & 0xffff) + 1;
  let result;
  try { result = compose(style, material, photo, seed, cam.abs); }
  catch (e) { console.warn(e); $('#revealHint').textContent = '這次沒有畫成，請回上一步再試一次'; return; }
  current_meta = { style, material, palette: extractPalette(photo) };
  cv.style.visibility = '';
  startReveal(result, mode);
});

function startReveal(res, mode) {
  const cv = $('#revealCanvas'), { W, H } = res;
  cv.width = W; cv.height = H; fitCanvas(cv, W, H);
  cv.classList.toggle('smear', mode === 'smear');
  const mw = Math.ceil(W / 6), mh = Math.ceil(H / 6), mask = makeCanvas(mw, mh);
  const nz = makeNoise((Date.now() & 0xfff) + 3), order = new Float32Array(mw * mh);
  let lo = 1e9, hi = -1e9;
  for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) {
    const dc = Math.hypot((x - mw / 2) / mw, (y - mh / 2) / mh) * 1.4;
    const v = .55 * nz.fbm(x * .08, y * .08, 3) + .45 * dc;
    order[y * mw + x] = v; lo = Math.min(lo, v); hi = Math.max(hi, v);
  }
  for (let i = 0; i < order.length; i++) order[i] = (order[i] - lo) / (hi - lo);
  reveal = {
    res, mode, ctx: cv.getContext('2d'), mask, mctx: readCtx(mask), mw, mh, order,
    maskImg: null, layer: makeCanvas(W, H), frame: res.water ? makeCanvas(W, H) : null,
    start: performance.now(), done: false, finishing: 0, dabs: 0, raf: 0, last: null,
    amp: W * (REDUCED ? .002 : .004)
  };
  reveal.maskImg = reveal.mctx.createImageData(mw, mh);
  $('#revealHint').textContent = mode === 'smear' ? '用手指或滑鼠，輕輕把畫刷出來' : '';
  reveal.raf = requestAnimationFrame(revealLoop);
}

function paintAutoMask(st, p) {
  const T = p * 1.3 - .15, d = st.maskImg.data;
  for (let i = 0; i < st.order.length; i++) {
    const a = clamp((T - st.order[i]) / .15, 0, 1);
    d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = 255; d[i * 4 + 3] = a * 255;
  }
  st.mctx.putImageData(st.maskImg, 0, 0);
}
function drawRevealFrame(st, t) {
  const { W, H, final, mat } = st.res;
  const target = st.frame ? st.frame.getContext('2d') : st.ctx;
  target.drawImage(mat, 0, 0);
  const l = st.layer.getContext('2d');
  l.globalCompositeOperation = 'source-over'; l.clearRect(0, 0, W, H); l.drawImage(final, 0, 0);
  l.globalCompositeOperation = 'destination-in'; l.drawImage(st.mask, 0, 0, W, H);
  l.globalCompositeOperation = 'source-over';
  target.drawImage(st.layer, 0, 0);
  if (st.frame) drawRipple(st.ctx, st.frame, t, st.amp);
}
function revealLoop(now) {
  const st = reveal; if (!st) return;
  if (!st.done) {
    if (st.mode === 'auto') {
      const lin = clamp((now - st.start) / REVEAL_MS, 0, 1);
      paintAutoMask(st, easeInOut(lin));
      if (lin >= 1) finishReveal(st);
    } else if (st.finishing) {
      const k = clamp((now - st.finishing) / 1200, 0, 1);
      st.mctx.globalAlpha = .08 + k * .3; st.mctx.fillStyle = '#fff'; st.mctx.fillRect(0, 0, st.mw, st.mh); st.mctx.globalAlpha = 1;
      if (k >= 1) finishReveal(st);
    }
  }
  drawRevealFrame(st, now / 1000);
  if (st.done && !st.res.water) return;
  st.raf = requestAnimationFrame(revealLoop);
}
function finishReveal(st) {
  st.done = true;
  st.mctx.globalAlpha = 1; st.mctx.fillStyle = '#fff'; st.mctx.fillRect(0, 0, st.mw, st.mh);
  vibrate([18, 60, 18]);
  Sound.complete();
  $('#revealCanvas').classList.remove('smear');
  saveFinal(st.res).then(ok => {
    $('#revealHint').textContent = ok ? '完成了，這幅畫已收進畫廊' : '這幅畫沒能存進畫廊，請先下載保存';
    let last = ''; try { last = localStorage.getItem('ubt-seal') || ''; } catch (e) {}
    $('#sealText').value = last;
    $('#sealBtn').disabled = false; $('#sealBtn').textContent = '蓋上印章';
    $('#doneActions').hidden = false;
  });
}
function stopReveal() {
  if (!reveal) return;
  cancelAnimationFrame(reveal.raf);
  for (const c of [reveal.layer, reveal.frame, reveal.mask, reveal.res.mat, reveal.res.final]) if (c) { c.width = 1; c.height = 1; }
  reveal = null;
}

/* 塗抹 */
const rcv = $('#revealCanvas');
function dab(st, mx, my) {
  const r = st.mw * .075, c = st.mctx;
  const g = c.createRadialGradient(mx, my, 0, mx, my, r);
  g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(.55, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.beginPath(); c.arc(mx, my, r, 0, Math.PI * 2); c.fill();
  for (let k = 0; k < 2; k++) {
    const a = Math.random() * Math.PI * 2, rr = r * rand(.3, .7), x = mx + Math.cos(a) * rr, y = my + Math.sin(a) * rr, r2 = r * .45;
    const g2 = c.createRadialGradient(x, y, 0, x, y, r2);
    g2.addColorStop(0, 'rgba(255,255,255,.5)'); g2.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g2; c.beginPath(); c.arc(x, y, r2, 0, Math.PI * 2); c.fill();
  }
  if (++st.dabs % 12 === 0) {
    const d = c.getImageData(0, 0, st.mw, st.mh).data;
    let on = 0; for (let i = 3; i < d.length; i += 4) if (d[i] > 180) on++;
    if (on / (st.mw * st.mh) >= .9 && !st.finishing) st.finishing = performance.now();
  }
}
function smearPoint(e) {
  const st = reveal; if (!st || st.mode !== 'smear' || st.done) return;
  const b = rcv.getBoundingClientRect();
  const mx = (e.clientX - b.left) / b.width * st.mw, my = (e.clientY - b.top) / b.height * st.mh;
  if (st.last) {
    const dx = mx - st.last[0], dy = my - st.last[1], dist = Math.hypot(dx, dy), step = st.mw * .025;
    for (let s = step; s < dist; s += step) dab(st, st.last[0] + dx * s / dist, st.last[1] + dy * s / dist);
  }
  dab(st, mx, my);
  st.last = [mx, my];
}
rcv.addEventListener('pointerdown', e => { if (!reveal || reveal.mode !== 'smear') return; rcv.setPointerCapture(e.pointerId); reveal.last = null; smearPoint(e); });
rcv.addEventListener('pointermove', e => { if (reveal && reveal.last) smearPoint(e); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => rcv.addEventListener(t, () => { if (reveal) reveal.last = null; }));


/* ---------- 保存作品（以 JPEG 字串保存，相容性較高） ---------- */
let lastSavedId = null, pendingFalls = [], currentWork = null;
async function saveRecord(work) {
  try { await store.put(work); }
  catch (e) { console.warn('IndexedDB 失敗，改存在這次瀏覽中', e); store.db = null; store.mem.push(work); }
  const all = await store.all();
  if (all.length > MAX_WORKS) {
    all.sort((a, b) => a.id - b.id);
    const extra = all.slice(0, all.length - MAX_WORKS);
    for (const w of extra) await store.del(w.id);
    pendingFalls.push(...extra);
  }
}
async function saveFinal(res) {
  try {
    const src = res.final.toDataURL('image/jpeg', .9);
    currentWork = { id: Date.now(), style: current_meta.style, material: current_meta.material, palette: current_meta.palette, src };
    await saveRecord(currentWork);
    lastSavedId = currentWork.id;
    return true;
  } catch (e) { console.warn('save failed', e); return false; }
}
function workSrc(w) { return w.src || URL.createObjectURL(new Blob([w.data], { type: 'image/jpeg' })); }
function loadImage(url) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; }); }
function dataURLtoBlob(src) {
  const [head, body] = src.split(','), bin = atob(body), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], { type: (head.match(/:(.*?);/) || [])[1] || 'image/jpeg' });
}
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
function toast(text) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = text; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3200);
}
function showSaveSheet(src) { $('#saveImg').src = src; $('#saveSheet').hidden = false; $('#saveClose').focus(); }
$('#saveClose').addEventListener('click', () => { $('#saveSheet').hidden = true; });
/* 依裝置選擇儲存方式：iPhone 用分享選單，其他裝置直接下載，都不行時顯示圖片讓人長按儲存 */
function download(src, id, blobIn) {
  const d = new Date(id), pad = n => String(n).padStart(2, '0');
  const name = `unnoticed-by-time-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.jpg`;
  let blob = blobIn || null;
  try { if (!blob && src.startsWith('data:')) blob = dataURLtoBlob(src); } catch (e) {}
  if (IS_TOUCH && blob && window.File && navigator.canShare) {
    const file = new File([blob], name, { type: 'image/jpeg' });
    if (navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Unnoticed by Time' }).catch(e => { if (e.name !== 'AbortError') showSaveSheet(src); });
      return;
    }
  }
  if (IS_IOS || !blob) { showSaveSheet(src); return; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  if (IS_TOUCH) toast('已開始下載，可在通知列或相簿查看');
}

/* 落款印章 */
function makeSeal(text, size) {
  const c = makeCanvas(size, size), x = c.getContext('2d');
  const rnd = mulberry32([...text].reduce((a, ch) => a * 31 + ch.codePointAt(0), 7) >>> 0);
  const inset = size * .04, j = size * .012, pts = [];
  const edge = (x0, y0, x1, y1) => { for (let i = 0; i < 10; i++) { const t = i / 10; pts.push([mix(x0, x1, t) + (rnd() - .5) * j * 2, mix(y0, y1, t) + (rnd() - .5) * j * 2]); } };
  edge(inset, inset, size - inset, inset); edge(size - inset, inset, size - inset, size - inset);
  edge(size - inset, size - inset, inset, size - inset); edge(inset, size - inset, inset, inset);
  x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath();
  x.fillStyle = '#B3352B'; x.fill();
  x.globalCompositeOperation = 'destination-out';
  x.fillStyle = '#000'; x.textAlign = 'center'; x.textBaseline = 'middle';
  const ch = [...text], font = fs => `500 ${fs}px "Noto Serif TC","Shippori Mincho",serif`;
  const put = (t, cx, cy, fs) => { x.font = font(fs); x.fillText(t, cx * size, cy * size); };
  if (ch.length === 1) put(ch[0], .5, .52, size * .64);
  else if (ch.length === 2) { put(ch[0], .5, .29, size * .4); put(ch[1], .5, .73, size * .4); }
  else if (ch.length === 3) { put(ch[0], .7, .29, size * .38); put(ch[1], .7, .73, size * .38); put(ch[2], .29, .51, size * .4); }
  else { put(ch[0], .7, .29, size * .38); put(ch[1], .7, .73, size * .38); put(ch[2], .29, .29, size * .38); put(ch[3], .29, .73, size * .38); }
  for (let k = 0; k < size * 1.2; k++) {
    x.globalAlpha = rnd() * .6; x.beginPath(); x.arc(rnd() * size, rnd() * size, rnd() * size * .012, 0, Math.PI * 2); x.fill();
  }
  x.globalAlpha = 1;
  return c;
}
$('#sealBtn').addEventListener('click', async () => {
  const st = reveal, text = $('#sealText').value.trim();
  if (!st || !currentWork) return;
  if (!text) { $('#revealHint').textContent = '先輸入一到四個字，再蓋上印章'; $('#sealText').focus(); return; }
  const { final, W, H, m } = st.res, size = Math.round(Math.max(W, H) * .075);
  const seal = makeSeal([...text].slice(0, 4).join(''), size), x = final.getContext('2d');
  x.save();
  x.translate(W - m - size * .85, H - m - size * .85); x.rotate((Math.random() - .5) * .05);
  x.globalCompositeOperation = 'multiply'; x.globalAlpha = .92;
  x.drawImage(seal, -size / 2, -size / 2);
  x.restore();
  Sound.stamp(); vibrate(40);
  if (!st.res.water) drawRevealFrame(st, 0);
  try { localStorage.setItem('ubt-seal', text); } catch (e) {}
  currentWork.src = final.toDataURL('image/jpeg', .9);
  try { await store.put(currentWork); } catch (e) { store.mem = store.mem.map(w => w.id === currentWork.id ? currentWork : w); }
  $('#sealBtn').disabled = true; $('#sealBtn').textContent = '已落款';
  $('#revealHint').textContent = '印章蓋好了';
});
$('#sealText').addEventListener('keydown', e => { if (e.key === 'Enter') $('#sealBtn').click(); });
$('#downloadBtn').addEventListener('click', () => { if (currentWork) download(currentWork.src, currentWork.id); });
$('#toGalleryBtn').addEventListener('click', () => go('gallery'));

/* ---------- 畫廊 ---------- */
const track = $('#track');
let galleryRaf = 0, waterItems = [];
const io = new IntersectionObserver(entries => {
  for (const en of entries) {
    const it = waterItems.find(w => w.el === en.target);
    if (it) it.visible = en.isIntersecting;
    if (en.target.classList.contains('leaving') && en.intersectionRatio > .5) dropWork(en.target);
  }
}, { root: track, threshold: [0, .5, .6] });

function fmtDate(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
}
async function makeWorkEl(w) {
  const el = document.createElement('figure');
  el.className = 'work';
  el.innerHTML = '<div class="top"></div><div class="cord"></div><div class="frame"><canvas role="img"></canvas></div>' +
    '<figcaption class="plaque"><time></time><span class="meta"></span><span class="palette"></span><button class="dl" type="button">下載</button></figcaption><div class="bottom"></div>';
  const src = workSrc(w), img = await loadImage(src);
  const cv = $('canvas', el), k = Math.min(1, 960 / Math.max(img.width, img.height));
  cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  const c = cv.getContext('2d'); c.drawImage(img, 0, 0, cv.width, cv.height);
  const label = `${STYLES[w.style] || '作品'}／${MATERIALS[w.material] || ''}`;
  cv.setAttribute('aria-label', label);
  $('time', el).textContent = fmtDate(w.id);
  $('.meta', el).textContent = label;
  $('.palette', el).innerHTML = (w.palette || []).map(h => `<i style="background:${h}" title="${h}"></i>`).join('');
  $('.dl', el).addEventListener('click', () => download(src, w.id, w.data ? new Blob([w.data], { type: 'image/jpeg' }) : null));
  $('.dl', el).setAttribute('aria-label', `下載 ${fmtDate(w.id)} 的${label}`);
  if (w.material === 'water') {
    const s2 = makeCanvas(cv.width, cv.height); s2.getContext('2d').drawImage(cv, 0, 0);
    waterItems.push({ el, ctx: c, src: s2, amp: cv.width * (REDUCED ? .002 : .004), visible: false });
  }
  return el;
}
async function renderGallery() {
  stopGallery();
  track.innerHTML = '';
  let works = [];
  try { works = await store.all(); } catch (e) {}
  works.sort((a, b) => b.id - a.id);
  $('#emptyMsg').hidden = works.length > 0 || pendingFalls.length > 0;
  $('#galleryCount').textContent = `${works.length}／${MAX_WORKS} 幅`;
  for (const w of works) {
    try {
      const el = await makeWorkEl(w);
      if (w.id === lastSavedId) el.classList.add('fresh');
      track.appendChild(el); io.observe(el);
    } catch (e) { console.warn('作品載入失敗', e); }
  }
  for (const w of pendingFalls) {
    try {
      const el = await makeWorkEl(w);
      el.classList.add('leaving'); el.dataset.id = w.id;
      track.appendChild(el); io.observe(el);
    } catch (e) {}
  }
  lastSavedId = null;
  track.scrollLeft = 0;
  galleryRaf = requestAnimationFrame(galleryTick);
}
function galleryTick(now) {
  const t = now / 1000;
  for (const it of waterItems) if (it.visible) drawRipple(it.ctx, it.src, t, it.amp);
  galleryRaf = requestAnimationFrame(galleryTick);
}
function dropWork(el) {
  el.classList.remove('leaving'); el.classList.add('fall');
  const id = Number(el.dataset.id);
  setTimeout(() => {
    io.unobserve(el); el.remove();
    pendingFalls = pendingFalls.filter(w => w.id !== id);
    waterItems = waterItems.filter(w => w.el !== el);
  }, 3900);
}
function stopGallery() {
  cancelAnimationFrame(galleryRaf);
  waterItems = [];
  io.disconnect();
}
track.addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { track.scrollLeft += e.deltaY; e.preventDefault(); }
}, { passive: false });
let drag = null;
track.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' || e.target.closest('button')) return;
  drag = { x: e.clientX, s: track.scrollLeft }; track.classList.add('dragging'); track.setPointerCapture(e.pointerId);
});
track.addEventListener('pointermove', e => { if (drag) track.scrollLeft = drag.s - (e.clientX - drag.x); });
['pointerup', 'pointercancel'].forEach(t => track.addEventListener(t, () => { drag = null; track.classList.remove('dragging'); }));
track.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') track.scrollBy({ left: 320, behavior: 'smooth' });
  if (e.key === 'ArrowLeft') track.scrollBy({ left: -320, behavior: 'smooth' });
});
$('#againBtn').addEventListener('click', () => go('capture'));

/* ---------- 撕畫拼貼 ---------- */
const tcv = $('#tableCanvas'), twrap = $('#tableWrap');
const table = { W: 0, H: 0, bg: null, pieces: [], tool: 'tear', raf: 0, dirty: true, path: null, pathId: null, ptrs: new Map(), grab: null };
const EMPTY_HINT = '從下方選畫放上桌面，可以放好幾幅';
function collageHint(t) { $('#collageHint').textContent = t; }
function hintFor(t) { return t === 'tear' ? '用手指從紙外劃過畫，一路劃到紙外，就能撕開' : '拖曳移動紙片，兩指旋轉縮放；電腦可用滾輪旋轉'; }
function sizeTable() {
  const cw = Math.max(1, twrap.clientWidth), ch = Math.max(1, twrap.clientHeight);
  const k = Math.min(devicePixelRatio || 1, 2, 1800 / cw);
  const W = Math.round(cw * k), H = Math.round(ch * k);
  if (W === table.W && H === table.H) return;
  if (table.W) { const fx = W / table.W, fy = H / table.H; for (const p of table.pieces) { p.x *= fx; p.y *= fy; p.tx *= fx; p.ty *= fy; p.s *= fx; } }
  table.W = tcv.width = W; table.H = tcv.height = H;
  table.bg = makeMaterial('washi', W, H, 5);
  table.dirty = true;
}
function startCollage() {
  sizeTable(); setTool(table.tool); fillTray();
  collageHint(table.pieces.length ? hintFor(table.tool) : EMPTY_HINT);
  cancelAnimationFrame(table.raf); table.raf = requestAnimationFrame(tableLoop);
}
function stopCollage() { cancelAnimationFrame(table.raf); }
async function fillTray() {
  const tray = $('#tray'); tray.innerHTML = '';
  let works = []; try { works = await store.all(); } catch (e) {}
  works.sort((a, b) => b.id - a.id);
  if (!works.length) { collageHint('畫廊還沒有作品，先去拍一張吧'); return; }
  for (const w of works) {
    const b = document.createElement('button'), src = workSrc(w), im = document.createElement('img');
    b.type = 'button'; im.alt = ''; im.src = src; b.appendChild(im);
    b.setAttribute('aria-label', `把 ${fmtDate(w.id)} 的${STYLES[w.style] || '作品'}放上桌面`);
    b.addEventListener('click', () => addSheet(src));
    tray.appendChild(b);
  }
}
function makePiece(c, x, y, r, s) { return { c, ctx: readCtx(c), x, y, r, s, tx: x, ty: y }; }
async function addSheet(src) {
  if (table.pieces.length >= 40) { collageHint('桌上的紙片太多了，先完成或清空一些'); return; }
  const img = await loadImage(src);
  const k = Math.min(table.W * .6 / img.width, table.H * .7 / img.height);
  const c = makeCanvas(Math.round(img.width * k), Math.round(img.height * k));
  readCtx(c).drawImage(img, 0, 0, c.width, c.height);
  table.pieces.push(makePiece(c, table.W / 2 + rand(-1, 1) * table.W * .08, table.H / 2 + rand(-1, 1) * table.H * .06, rand(-.05, .05), 1));
  table.dirty = true;
  collageHint(hintFor(table.tool));
}
function toTable(e) { const b = tcv.getBoundingClientRect(); return [(e.clientX - b.left) * table.W / b.width, (e.clientY - b.top) * table.H / b.height]; }
function toLocal(p, x, y) {
  const dx = x - p.x, dy = y - p.y, cs = Math.cos(-p.r), sn = Math.sin(-p.r);
  return [(dx * cs - dy * sn) / p.s + p.c.width / 2, (dx * sn + dy * cs) / p.s + p.c.height / 2];
}
function alphaAt(p, lx, ly) {
  if (lx < 0 || ly < 0 || lx >= p.c.width || ly >= p.c.height) return 0;
  return p.ctx.getImageData(lx | 0, ly | 0, 1, 1).data[3];
}
function pieceAt(x, y) {
  for (let i = table.pieces.length - 1; i >= 0; i--) { const p = table.pieces[i], q = toLocal(p, x, y); if (alphaAt(p, q[0], q[1]) > 20) return p; }
  return null;
}
function toFront(p) { const i = table.pieces.indexOf(p); table.pieces.splice(i, 1); table.pieces.push(p); }
function drawTable(ctx, withPath) {
  ctx.drawImage(table.bg, 0, 0);
  for (const p of table.pieces) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(p.s, p.s);
    ctx.shadowColor = 'rgba(38,36,31,.3)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    ctx.drawImage(p.c, -p.c.width / 2, -p.c.height / 2); ctx.restore();
  }
  if (withPath && table.path && table.path.length > 1) {
    ctx.save(); ctx.strokeStyle = 'rgba(38,36,31,.55)'; ctx.lineWidth = 2 * Math.min(devicePixelRatio || 1, 2);
    ctx.setLineDash([6, 8]); ctx.beginPath();
    table.path.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.stroke(); ctx.restore();
  }
}
function tableLoop() {
  table.raf = requestAnimationFrame(tableLoop);
  let moving = false;
  for (const p of table.pieces) {
    const dx = p.tx - p.x, dy = p.ty - p.y;
    if (Math.abs(dx) + Math.abs(dy) > .3) { p.x += dx * .18; p.y += dy * .18; moving = true; }
  }
  if (!table.dirty && !moving) return;
  table.dirty = false;
  drawTable(tcv.getContext('2d'), true);
}
function setTool(t) {
  table.tool = t;
  $$('#collage [data-tool]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.tool === t)));
  tcv.classList.toggle('move', t === 'move');
  if (table.pieces.length) collageHint(hintFor(t));
}
$$('#collage [data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));

tcv.addEventListener('pointerdown', e => {
  tcv.setPointerCapture(e.pointerId);
  const pt = toTable(e); table.ptrs.set(e.pointerId, pt);
  if (table.tool === 'tear') { if (!table.path) { table.path = [pt]; table.pathId = e.pointerId; } return; }
  if (table.ptrs.size === 1) {
    const p = pieceAt(pt[0], pt[1]); if (!p) return;
    toFront(p); table.grab = { p, ox: p.x - pt[0], oy: p.y - pt[1] }; table.dirty = true;
  } else if (table.ptrs.size === 2 && table.grab) {
    const [a, b] = [...table.ptrs.values()], g = table.grab;
    g.two = { ang: Math.atan2(b[1] - a[1], b[0] - a[0]), dist: Math.hypot(b[0] - a[0], b[1] - a[1]), r0: g.p.r, s0: g.p.s, mx: (a[0] + b[0]) / 2, my: (a[1] + b[1]) / 2, x0: g.p.x, y0: g.p.y };
  }
});
tcv.addEventListener('pointermove', e => {
  if (!table.ptrs.has(e.pointerId)) return;
  const pt = toTable(e); table.ptrs.set(e.pointerId, pt);
  if (table.tool === 'tear') {
    if (table.path && e.pointerId === table.pathId) {
      const l = table.path[table.path.length - 1];
      if (Math.hypot(pt[0] - l[0], pt[1] - l[1]) > 4) { table.path.push(pt); table.dirty = true; }
    }
    return;
  }
  const g = table.grab; if (!g) return;
  if (g.two && table.ptrs.size >= 2) {
    const [a, b] = [...table.ptrs.values()];
    g.p.r = g.two.r0 + Math.atan2(b[1] - a[1], b[0] - a[0]) - g.two.ang;
    g.p.s = clamp(g.two.s0 * Math.hypot(b[0] - a[0], b[1] - a[1]) / Math.max(1, g.two.dist), .25, 3);
    g.p.x = g.p.tx = g.two.x0 + (a[0] + b[0]) / 2 - g.two.mx;
    g.p.y = g.p.ty = g.two.y0 + (a[1] + b[1]) / 2 - g.two.my;
  } else { g.p.x = g.p.tx = pt[0] + g.ox; g.p.y = g.p.ty = pt[1] + g.oy; }
  table.dirty = true;
});
function endPtr(e) {
  table.ptrs.delete(e.pointerId);
  if (table.tool === 'tear' && table.path && e.pointerId === table.pathId) {
    const path = table.path; table.path = null; table.pathId = null; table.dirty = true;
    if (path.length > 3) tryTear(path);
  }
  const g = table.grab;
  if (g) {
    if (table.ptrs.size === 1 && g.two) { const only = [...table.ptrs.values()][0]; g.two = null; g.ox = g.p.x - only[0]; g.oy = g.p.y - only[1]; }
    if (table.ptrs.size === 0) table.grab = null;
  }
}
tcv.addEventListener('pointerup', endPtr);
tcv.addEventListener('pointercancel', endPtr);
tcv.addEventListener('wheel', e => {
  if (table.tool !== 'move') return;
  const pt = toTable(e), p = pieceAt(pt[0], pt[1]); if (!p) return;
  e.preventDefault(); p.r += e.deltaY * .002; table.dirty = true;
}, { passive: false });

function tryTear(path) {
  for (let i = table.pieces.length - 1; i >= 0; i--) {
    const p = table.pieces[i], loc = path.map(q => toLocal(p, q[0], q[1]));
    const inside = loc.filter(q => alphaAt(p, q[0], q[1]) > 20).length;
    if (inside < 3) continue;
    const f = loc[0], l = loc[loc.length - 1];
    if (alphaAt(p, f[0], f[1]) > 20 || alphaAt(p, l[0], l[1]) > 20) { collageHint('要從紙外開始劃，一路劃到紙外才撕得開'); return; }
    if (!tearPiece(p, loc)) collageHint('這一道太靠邊了，換個位置再試試');
    return;
  }
}
function tearPiece(p, loc) {
  const w = p.c.width, h = p.c.height, big = Math.max(w, h) / p.s;
  const stepL = Math.max(3, Math.max(w, h) / 220), amp = Math.max(1.5, Math.max(w, h) / 260), J = [];
  for (let i = 0; i < loc.length - 1; i++) {
    const [x0, y0] = loc[i], [x1, y1] = loc[i + 1], d = Math.hypot(x1 - x0, y1 - y0) || 1, n = Math.max(1, Math.round(d / stepL));
    const nx = -(y1 - y0) / d, ny = (x1 - x0) / d;
    for (let k = 0; k < n; k++) {
      const t = k / n, off = (Math.random() - .5) * 2 * amp + (Math.random() < .15 ? (Math.random() - .5) * amp * 3 : 0);
      J.push([mix(x0, x1, t) + nx * off, mix(y0, y1, t) + ny * off]);
    }
  }
  J.push(loc[loc.length - 1]);
  const unit = (ax, ay) => { const d = Math.hypot(ax, ay) || 1; return [ax / d, ay / d]; };
  const D = (w + h) * 3, f = J[0], f2 = J[Math.min(2, J.length - 1)], l = J[J.length - 1], l2 = J[Math.max(0, J.length - 3)];
  const [sx, sy] = unit(f[0] - f2[0], f[1] - f2[1]), [ex, ey] = unit(l[0] - l2[0], l[1] - l2[1]);
  const E0 = [f[0] + sx * D, f[1] + sy * D], En = [l[0] + ex * D, l[1] + ey * D];
  const [cx, cy] = unit(En[0] - E0[0], En[1] - E0[1]), N = [-cy, cx];
  const poly = [E0, ...J, En, [En[0] + N[0] * D, En[1] + N[1] * D], [E0[0] + N[0] * D, E0[1] + N[1] * D]];
  const trace = c => { c.beginPath(); poly.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.closePath(); };
  const edgeLine = (c, wd, col) => { c.lineWidth = wd; c.strokeStyle = col; c.beginPath(); J.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.stroke(); };
  const lw = Math.max(2.5, Math.max(w, h) / 160);
  const A = makeCanvas(w, h), ax = readCtx(A);
  ax.drawImage(p.c, 0, 0); ax.globalCompositeOperation = 'destination-in'; trace(ax); ax.fill();
  ax.globalCompositeOperation = 'source-atop'; ax.lineJoin = ax.lineCap = 'round';
  edgeLine(ax, lw * 1.7, 'rgba(250,247,238,.55)'); edgeLine(ax, lw, 'rgba(252,250,244,.96)');
  const B = makeCanvas(w, h), bx = readCtx(B);
  bx.drawImage(p.c, 0, 0); bx.globalCompositeOperation = 'destination-out'; trace(bx); bx.fill();
  bx.globalCompositeOperation = 'source-atop'; bx.lineJoin = bx.lineCap = 'round';
  edgeLine(bx, lw * .7, 'rgba(250,247,238,.6)');
  const area = c => { const t = makeCanvas(48, 48), tx = readCtx(t); tx.drawImage(c, 0, 0, 48, 48); const d = tx.getImageData(0, 0, 48, 48).data; let n = 0; for (let i = 3; i < d.length; i += 4) if (d[i] > 30) n++; return n; };
  const a0 = area(p.c);
  if (area(A) < a0 * .03 || area(B) < a0 * .03) return false;
  const i = table.pieces.indexOf(p), pa = trimPiece(A, p), pb = trimPiece(B, p);
  const cs = Math.cos(p.r), sn = Math.sin(p.r), nX = N[0] * cs - N[1] * sn, nY = N[0] * sn + N[1] * cs, gap = Math.max(table.W, table.H) * .012;
  pa.tx = pa.x + nX * gap; pa.ty = pa.y + nY * gap; pb.tx = pb.x - nX * gap; pb.ty = pb.y - nY * gap;
  table.pieces.splice(i, 1, pb, pa);
  p.c.width = 1; p.c.height = 1;
  table.dirty = true; Sound.tear(); vibrate(30);
  collageHint(table.pieces.length > 2 ? '可以繼續撕，或切換到「移動」把碎片拼起來' : '撕開了。切換到「移動」可以拖曳碎片');
  return true;
}
function trimPiece(c, base) {
  const w = c.width, h = c.height, d = readCtx(c).getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 8) {
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1, t = makeCanvas(bw, bh);
  readCtx(t).drawImage(c, -x0, -y0); c.width = 1; c.height = 1;
  const ox = (x0 + bw / 2 - w / 2) * base.s, oy = (y0 + bh / 2 - h / 2) * base.s, cs = Math.cos(base.r), sn = Math.sin(base.r);
  return makePiece(t, base.x + ox * cs - oy * sn, base.y + ox * sn + oy * cs, base.r, base.s);
}
$('#saveCollage').addEventListener('click', async () => {
  if (!table.pieces.length) { collageHint('桌上還沒有紙片'); return; }
  const c = makeCanvas(table.W, table.H); drawTable(c.getContext('2d'), false);
  const k = Math.min(1, 1600 / Math.max(c.width, c.height));
  let out = c;
  if (k < 1) { out = makeCanvas(Math.round(c.width * k), Math.round(c.height * k)); out.getContext('2d').drawImage(c, 0, 0, out.width, out.height); }
  const work = { id: Date.now(), style: 'collage', material: 'washi', palette: extractPalette(out), src: out.toDataURL('image/jpeg', .9) };
  try { await saveRecord(work); lastSavedId = work.id; } catch (e) { collageHint('沒能存進畫廊，請再試一次'); return; }
  Sound.complete(); vibrate([18, 60, 18]);
  for (const p of table.pieces) { p.c.width = 1; p.c.height = 1; }
  table.pieces = []; table.dirty = true;
  go('gallery');
});
$('#clearTable').addEventListener('click', () => {
  for (const p of table.pieces) { p.c.width = 1; p.c.height = 1; }
  table.pieces = []; table.dirty = true; collageHint(EMPTY_HINT);
});
$('#toCollage').addEventListener('click', () => go('collage'));

/* ---------- 開場 ---------- */
async function updateOpeningLink() {
  let n = 0;
  try { n = (await store.all()).length; } catch (e) {}
  const b = $('#openGallery');
  b.hidden = n === 0;
  b.textContent = `走進畫廊（${n}）`;
}
$('#openGallery').addEventListener('click', () => { Sound.init(); go('gallery'); });
$('#enterBtn').addEventListener('click', () => { Sound.init(); go('capture'); });
$('#soundBtn').addEventListener('click', () => { Sound.setOn(!Sound.on); Sound.init(); });
document.addEventListener('pointerdown', () => Sound.init(), { once: true });

/* ---------- 啟動 ---------- */
let resizeTimer = 0, lastSize = innerWidth + 'x' + innerHeight;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const s = innerWidth + 'x' + innerHeight;
    if (s !== lastSize) { lastSize = s; drawSand(); }
    if (reveal) fitCanvas($('#revealCanvas'), reveal.res.W, reveal.res.H);
    if (current === 'collage') sizeTable();
  }, 250);
});
(async function init() {
  drawSand();
  $('#gallery').style.backgroundImage = `url(${makeWall()})`;
  $$('.swatch').forEach(s => { s.style.backgroundImage = `url(${makeMaterial(s.dataset.mat, 72, 72, 3).toDataURL()})`; });
  await store.open();
  updateOpeningLink();
})();
})();
